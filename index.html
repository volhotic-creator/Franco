<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Franco · Publicaciones LUK</title>
<style>
/* ══════════════════════════════════════════════
   VARIABLES & RESET
══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --naranja:     #F7941D;
  --naranja-2:   #FF6B00;
  --naranja-dim: rgba(247,148,29,.15);
  --naranja-glow:rgba(247,148,29,.35);
  --negro:       #000000;
  --card-bg:     #111111;
  --card-bg2:    #181818;
  --border:      #2a2a2a;
  --border-hot:  rgba(247,148,29,.5);
  --texto:       #f0f0f0;
  --muted:       #888;
  --verde:       #22c55e;
  --verde-bg:    rgba(34,197,94,.12);
  --rojo:        #ef4444;
  --rojo-bg:     rgba(239,68,68,.10);
  --radius:      12px;
  --radius-sm:   8px;
  --font:        'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:#0a0a0a;
  color:var(--texto);
  min-height:100vh;
  overflow-x:hidden;
}

/* ══════════════════════════════════════════════
   SCROLLBAR
══════════════════════════════════════════════ */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--naranja)}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
.header{
  background:var(--negro);
  border-bottom:2px solid var(--naranja);
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:200;
  box-shadow:0 4px 30px rgba(247,148,29,.2);
}
.brand{display:flex;align-items:center;gap:14px;padding:14px 0}
.globo{
  width:46px;height:46px;
  background:linear-gradient(135deg,var(--naranja) 0%,var(--naranja-2) 100%);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  box-shadow:0 0 18px var(--naranja-glow);
  flex-shrink:0;
  position:relative;
}
.globo::after{
  content:'';
  position:absolute;bottom:-6px;left:50%;
  transform:translateX(-50%);
  width:2px;height:7px;
  background:var(--naranja);
  border-radius:1px;
}
.brand-text h1{
  font-size:18px;font-weight:800;
  background:linear-gradient(90deg,#fff 0%,var(--naranja) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:.5px;
}
.brand-text p{font-size:11px;color:var(--muted);margin-top:1px}

/* Stats strip */
.stats-strip{
  display:flex;gap:6px;padding:10px 0;flex-wrap:wrap;
}
.stat-pill{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:20px;
  padding:6px 14px;
  text-align:center;
  transition:border-color .2s;
}
.stat-pill:hover{border-color:var(--naranja)}
.stat-pill .n{
  font-size:18px;font-weight:800;
  color:var(--naranja);
  line-height:1;display:block;
}
.stat-pill .l{
  font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;
}
.stat-pill.pub .n{color:var(--verde)}
.stat-pill.warn .n{color:#f59e0b}

/* Progress bar */
.progress-bar-wrap{
  width:100%;height:3px;
  background:var(--border);
}
.progress-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--naranja),var(--naranja-2));
  transition:width .5s ease;
  border-radius:0 2px 2px 0;
  box-shadow:0 0 8px var(--naranja-glow);
}

/* ══════════════════════════════════════════════
   TOOLBAR
══════════════════════════════════════════════ */
.toolbar{
  background:#0d0d0d;
  border-bottom:1px solid var(--border);
  padding:12px 28px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  position:sticky;top:89px;z-index:199;
}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap svg{
  position:absolute;left:12px;top:50%;
  transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted);
}
#search{
  width:100%;
  background:var(--card-bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px 9px 36px;
  color:var(--texto);
  font-size:14px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
#search:focus{
  border-color:var(--naranja);
  box-shadow:0 0 0 3px var(--naranja-dim);
}
#search::placeholder{color:#444}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{
  background:var(--card-bg);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;font-weight:600;
  color:var(--muted);
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  letter-spacing:.3px;
}
.fbtn:hover{border-color:var(--naranja);color:var(--naranja)}
.fbtn.on{
  background:var(--naranja);
  border-color:var(--naranja);
  color:#000;
  box-shadow:0 0 10px var(--naranja-glow);
}
.fbtn.warn-btn.on{background:#f59e0b;border-color:#f59e0b;color:#000}
.fbtn.pub-btn.on{background:var(--verde);border-color:var(--verde);color:#000}
#count-lbl{
  margin-left:auto;
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}

/* ══════════════════════════════════════════════
   GRID
══════════════════════════════════════════════ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:16px;
  padding:20px 28px 60px;
  max-width:1440px;margin:0 auto;
}

/* ══════════════════════════════════════════════
   CARD
══════════════════════════════════════════════ */
.card{
  background:var(--card-bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.card:hover{
  border-color:var(--border-hot);
  box-shadow:0 0 24px rgba(247,148,29,.12);
  transform:translateY(-2px);
}
.card.publicado{
  border-color:rgba(34,197,94,.4);
  opacity:.7;
}
.card.publicado:hover{opacity:1}
.card.sin-foto{border-color:#f59e0b44}

/* Card top stripe */
.card-stripe{
  height:3px;
  background:linear-gradient(90deg,var(--naranja),var(--naranja-2));
}
.card.sin-foto .card-stripe{background:linear-gradient(90deg,#f59e0b,#d97706)}
.card.publicado .card-stripe{background:linear-gradient(90deg,var(--verde),#16a34a)}

/* Card header */
.card-head{
  padding:14px 16px 10px;
  display:flex;align-items:flex-start;gap:10px;
}
.cat-tag{
  flex-shrink:0;
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  padding:3px 9px;border-radius:10px;
  margin-top:2px;
}
.tag-kit{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.tag-vol{background:rgba(99,179,237,.15);color:#7dd3fc;border:1px solid rgba(99,179,237,.3)}
.tag-otro{background:var(--naranja-dim);color:var(--naranja);border:1px solid rgba(247,148,29,.3)}
.card-title{
  font-size:14px;font-weight:700;
  color:#fff;line-height:1.4;
  flex:1;
}

/* Pub badge */
.pub-mark{
  flex-shrink:0;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--verde-bg);
  border:1.5px solid var(--verde);
  display:flex;align-items:center;justify-content:center;
  display:none;
}
.card.publicado .pub-mark{display:flex}
.pub-mark svg{width:11px;height:11px;color:var(--verde)}

/* Sin foto banner */
.no-foto-bar{
  background:#1a1200;
  border-top:1px solid #f59e0b33;
  border-bottom:1px solid #f59e0b33;
  padding:5px 16px;
  font-size:11px;font-weight:700;
  color:#f59e0b;
  display:flex;align-items:center;gap:6px;
}

/* Card body */
.card-body{padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:10px}

/* Fields */
.fields{display:flex;flex-direction:column;gap:6px}
.field{
  display:flex;align-items:center;gap:8px;
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:7px 10px;
  min-height:36px;
}
.field-lbl{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);
  white-space:nowrap;
  min-width:80px;
}
.field-val{
  font-size:13px;font-weight:600;
  color:#e8e8e8;
  flex:1;
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  word-break:break-all;
}
.field-val.txt{font-family:var(--font);font-size:12px;color:#ccc;font-weight:400}
.field-val.na{color:#444;font-style:italic;font-family:var(--font);font-weight:400;font-size:12px}
.field-val.pend{
  color:#f59e0b;font-family:var(--font);font-size:11px;font-weight:600;font-style:italic;
}

/* Stock indicator */
.stock-ind{display:flex;align-items:center;gap:6px}
.stock-dot{width:7px;height:7px;border-radius:50%;background:var(--verde);flex-shrink:0}
.stock-dot.low{background:#f59e0b}
.stock-dot.out{background:var(--rojo)}
.stock-num{font-size:13px;font-weight:700;color:#e8e8e8;font-family:'SF Mono',monospace}
.fotos-ind{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:#7dd3fc;
  font-family:var(--font);
}

/* Copy micro-button */
.cbtn{
  background:none;border:none;cursor:pointer;
  padding:4px;border-radius:5px;
  color:#444;
  transition:all .15s;flex-shrink:0;
}
.cbtn:hover{color:var(--naranja);background:var(--naranja-dim)}
.cbtn.ok{color:var(--verde)}
.cbtn svg{display:block;width:13px;height:13px}

/* Divider */
.divider{
  height:1px;background:var(--border);margin:4px 0;
}

/* Section label */
.sec-label{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--naranja);
  padding:2px 0;
}

/* ══════════════════════════════════════════════
   COPY BLOCK (ML sections)
══════════════════════════════════════════════ */
.copy-block{
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.copy-block-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;
  border-bottom:1px solid var(--border);
}
.copy-block-label{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;
  color:var(--naranja);
}
.copy-block-body{
  padding:9px 10px;
  font-size:11px;color:#aaa;
  line-height:1.55;
  max-height:80px;overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
}
.copy-block-body.pend{
  color:#f59e0b44;
  font-style:italic;
}
.copy-block-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;
  color:var(--muted);
  padding:3px 7px;border-radius:5px;
  transition:all .15s;
  letter-spacing:.3px;
}
.copy-block-btn:hover{color:var(--naranja);background:var(--naranja-dim)}
.copy-block-btn.ok{color:var(--verde)}
.copy-block-btn svg{width:11px;height:11px}

/* ══════════════════════════════════════════════
   CARD FOOTER
══════════════════════════════════════════════ */
.card-foot{
  padding:12px 16px;
  border-top:1px solid var(--border);
  display:flex;gap:8px;
}
.btn-pub{
  flex:1;
  background:linear-gradient(135deg,var(--naranja) 0%,var(--naranja-2) 100%);
  color:#000;
  border:none;border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:12px;font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .18s;
  letter-spacing:.4px;
  text-transform:uppercase;
}
.btn-pub:hover{box-shadow:0 0 16px var(--naranja-glow);filter:brightness(1.1)}
.btn-pub:active{transform:scale(.97)}
.btn-pub.ok{
  background:linear-gradient(135deg,var(--verde) 0%,#16a34a 100%);
  box-shadow:0 0 14px rgba(34,197,94,.3);
}
.btn-pub svg{width:14px;height:14px}

.btn-done{
  background:var(--card-bg2);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  color:var(--muted);font-size:11px;font-weight:700;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.btn-done:hover{border-color:var(--verde);color:var(--verde)}
.card.publicado .btn-done{
  border-color:var(--verde);
  color:var(--verde);
  background:var(--verde-bg);
}
.btn-done svg{width:13px;height:13px}

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--naranja);color:#000;
  padding:10px 22px;border-radius:30px;
  font-size:13px;font-weight:800;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:9999;
  white-space:nowrap;
  box-shadow:0 4px 20px var(--naranja-glow);
  letter-spacing:.3px;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════════ */
#empty{
  display:none;
  grid-column:1/-1;
  text-align:center;padding:60px 20px;
  color:var(--muted);
}
#empty .big{font-size:48px;margin-bottom:12px}
#empty p{font-size:15px}

/* ══════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════ */
@media(max-width:640px){
  .header,.toolbar{padding:0 14px}
  .toolbar{top:0;position:static}
  .header{position:static}
  .grid{padding:14px;gap:12px}
  .stats-strip{gap:4px}
}
</style>
</head>

//  FICHAS TÉCNICAS — se completarán con el Excel del scraping
//  Estructura: { [id]: { titulo_ml, descripcion, compatibilidades, specs } }
// ════════════════════════════════════════════════════════
const FICHAS = {};
// Cuando llegue el Excel, los datos se cargarán aquí.
// Ejemplo de estructura esperada:
// FICHAS[4] = {
//   titulo_ml: "Kit Embrague Audi A3 2.0 FSI LUK 623309400 230mm",
//   descripcion: "Kit de embrague original LUK...",
//   compatibilidades: "Audi A3 (8P) 2.0 FSI 150cv 2003-2012\nSeat Leon...",
//   specs: "Diámetro disco: 230mm\nPresión plato: 8500N\nMaterial: Orgánico"

// ════════════════════════════════════════════════════════
//  ESTADO PUBLICADO — persiste en localStorage
// ════════════════════════════════════════════════════════
function loadState(){
  try{ return JSON.parse(localStorage.getItem('luk_pub')||'{}') }
  catch(e){ return {} }
}
function saveState(s){
  try{ localStorage.setItem('luk_pub',JSON.stringify(s)) }catch(e){}
}
let STATE = loadState();

function togglePublicado(id){
  STATE[id] = !STATE[id];
  saveState(STATE);
  updateStats();
  updateProgress();
  // re-render the single card
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    card.classList.toggle('publicado', !!STATE[id]);
    const stripe = card.querySelector('.card-stripe');
    const btnDone = card.querySelector('.btn-done');
    if(STATE[id]){
      stripe && (stripe.style.background='linear-gradient(90deg,#22c55e,#16a34a)');
      btnDone && (btnDone.innerHTML = IC_CHECK + ' Publicado');
    } else {
      const base = card.dataset.sfoto==='1'
        ? 'linear-gradient(90deg,#f59e0b,#d97706)'
        : 'linear-gradient(90deg,#F7941D,#FF6B00)';
      stripe && (stripe.style.background=base);
      btnDone && (btnDone.innerHTML = IC_CIRCLE + ' Marcar pub.');
    }
    card.querySelector('.pub-mark') && (card.querySelector('.pub-mark').style.display = STATE[id]?'flex':'none');
  }
  // apply filter
  applyFilters();
}

// ════════════════════════════════════════════════════════
//  STATS & PROGRESS
// ════════════════════════════════════════════════════════
function updateStats(){
  const pub   = Object.values(STATE).filter(Boolean).length;
  const pend  = DB.length - pub;
  const stock = DB.reduce((a,p)=>a+p.qty,0);
  const sf    = DB.filter(p=>p.fotos===0).length;
  document.getElementById('s-total').textContent = DB.length;
  document.getElementById('s-pub').textContent   = pub;
  document.getElementById('s-pend').textContent  = pend;
  document.getElementById('s-sfoto').textContent = sf;
  document.getElementById('s-stock').textContent = stock;
}
function updateProgress(){
  const pub = Object.values(STATE).filter(Boolean).length;
  const pct = Math.round(pub/DB.length*100);
  document.getElementById('prog').style.width = pct+'%';
}

// ════════════════════════════════════════════════════════
//  ICONS
// ════════════════════════════════════════════════════════
const IC_COPY   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
const IC_CHECK  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
const IC_CIRCLE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
const IC_ML     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const IC_WARN   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;

// ════════════════════════════════════════════════════════
//  COPY
// ════════════════════════════════════════════════════════
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1700);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text);return true }
  catch{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    return true;
  }
}
function cpField(btn,text,label){
  copy(text).then(()=>{
    const orig=btn.innerHTML;
    btn.classList.add('ok');btn.innerHTML=IC_CHECK;
    showToast('✓ '+label+' copiado');
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=orig},1600);
  });
}
function cpBlock(btn,text,label){
  copy(text).then(()=>{
    const orig=btn.innerHTML;
    btn.classList.add('ok');btn.innerHTML=IC_CHECK+' Copiado';
    showToast('✓ '+label+' copiado');
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=orig},1700);
  });
}

// ════════════════════════════════════════════════════════
//  BUILD TITULO ML (optimizado, ~60 chars)
// ════════════════════════════════════════════════════════
function tituloML(p){
  const f = FICHAS[p.id];
  if(f && f.titulo_ml) return f.titulo_ml;
  // auto-generate
  const base = p.desc.replace(/\s+/g,' ').trim();
  const sku  = p.sku.replace(/\s/g,'');
  let t = `${base} LUK ${sku}`;
  if(t.length > 60) t = t.slice(0,57)+'...';
  return t;
}

// ════════════════════════════════════════════════════════
//  RENDER CARD
// ════════════════════════════════════════════════════════
function catTag(c){
  if(c==='kit')     return ['Kit Embrague','tag-kit'];
  if(c==='volante') return ['Volante Bimasa','tag-vol'];
  return ['Otro','tag-otro'];
}

function renderCard(p){
  const pub     = !!STATE[p.id];
  const sf      = p.fotos===0;
  const f       = FICHAS[p.id]||{};
  const [tl,tc] = catTag(p.cat);
  const tituloVal = tituloML(p);
  const descVal   = f.descripcion   || null;
  const compatVal = f.compatibilidades || null;
  const specsVal  = f.specs          || null;

  const stockCls = p.qty===0?'out':p.qty<=2?'low':'';
  const stockLbl = p.qty===0?'Sin stock':p.qty+' ud'+(p.qty!==1?'s.':`${p.qty===1?'.':'.'}`);

  const fotosHtml = sf
    ? `<span style="color:#f59e0b;font-size:11px;font-weight:700;">⚠ Sin fotos</span>`
    : `<span class="fotos-ind">📷 ${p.fotos} foto${p.fotos!==1?'s':''}</span>`;

  const oemHtml = p.oem
    ? `<span class="field-val">${p.oem}</span><button class="cbtn" onclick="cpField(this,'${p.oem}','N° Original')" title="Copiar">${IC_COPY}</button>`
    : `<span class="field-val na">No disponible</span>`;

  const noFotaBanner = sf
    ? `<div class="no-foto-bar">${IC_WARN} Faltan fotos — pendiente de imágenes</div>`
    : '';

  // ML copy blocks
  function block(label, val, key){
    const hasPend = !val;
    const bodyTxt = hasPend
      ? `⏳ Pendiente — se cargará con el Excel del scraping`
      : val;
    const bodyCls = hasPend ? 'copy-block-body pend' : 'copy-block-body';
    const btnHtml = hasPend
      ? `<span class="copy-block-btn" style="color:#444;cursor:default">—</span>`
      : `<button class="copy-block-btn" onclick="cpBlock(this,\`${val.replace(/`/g,"'").replace(/\n/g,'\\n')}\`,'${label}')">${IC_COPY} Copiar</button>`;
    return `
<div class="copy-block">
  <div class="copy-block-header">
    <span class="copy-block-label">${label}</span>
    ${btnHtml}
  </div>
  <div class="${bodyCls}">${bodyTxt.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
</div>`;
  }

  return `
<div class="card${pub?' publicado':''}${sf?' sin-foto':''}" data-id="${p.id}" data-cat="${p.cat}" data-fotos="${sf?0:1}" data-sfoto="${sf?1:0}">
  <div class="card-stripe"${pub?' style="background:linear-gradient(90deg,#22c55e,#16a34a)"'
    :sf?' style="background:linear-gradient(90deg,#f59e0b,#d97706)"':''}></div>
  <div class="card-head">
    <span class="cat-tag ${tc}">${tl}</span>
    <span class="card-title">${p.desc}</span>
    <div class="pub-mark" style="${pub?'display:flex':'display:none'}">${IC_CHECK}</div>
  </div>
  ${noFotaBanner}
  <div class="card-body">
    <!-- Datos base -->
    <div class="sec-label">Identificación</div>
    <div class="fields">
      <div class="field">
        <span class="field-lbl">N° LUK</span>
        <span class="field-val">${p.sku}</span>
        <button class="cbtn" onclick="cpField(this,'${p.sku}','SKU LUK')" title="Copiar">${IC_COPY}</button>
      </div>
      <div class="field">
        <span class="field-lbl">N° Original</span>
        ${oemHtml}
      </div>
      <div class="field">
        <span class="field-lbl">Stock</span>
        <span class="field-val">
          <span class="stock-ind">
            <span class="stock-dot ${stockCls}"></span>
            <span class="stock-num">${p.qty} ud${p.qty!==1?'s.':'.'}</span>
          </span>
        </span>
      </div>
      <div class="field">
        <span class="field-lbl">Fotos</span>
        <span class="field-val">${fotosHtml}</span>
      </div>
    </div>

    <div class="divider"></div>
    <div class="sec-label">MercadoLibre — Copiar campos</div>

    <!-- TITULO ML -->
    <div class="copy-block">
      <div class="copy-block-header">
        <span class="copy-block-label">📌 Título ML (${tituloVal.length} chars)</span>
        <button class="copy-block-btn" onclick="cpBlock(this,'${tituloVal.replace(/'/g,'\\'')}','Título ML')">${IC_COPY} Copiar</button>
      </div>
      <div class="copy-block-body" style="color:#e8e8e8;font-weight:600;max-height:none">${tituloVal}</div>
    </div>

    ${block('📝 Descripción',          descVal,   'descripcion')}
    ${block('🚗 Compatibilidades',     compatVal, 'compatibilidades')}
    ${block('🔧 Ficha Técnica / Specs',specsVal,  'specs')}
  </div>

  <div class="card-foot">
    <button class="btn-pub${FICHAS[p.id]?'':''}" onclick="cpFull(${p.id})">
      ${IC_ML} Copiar todo para ML
    </button>
    <button class="btn-done" onclick="togglePublicado(${p.id})">
      ${pub ? IC_CHECK+' Publicado' : IC_CIRCLE+' Marcar pub.'}
    </button>
  </div>
</div>`;
}

// ════════════════════════════════════════════════════════
//  COPY TODO PARA ML
// ════════════════════════════════════════════════════════
function cpFull(id){
  const p = DB.find(x=>x.id===id);
  const f = FICHAS[id]||{};
  const lines=[
    '═══════ TÍTULO ═══════',
    tituloML(p),
    '',
    '═══════ DESCRIPCIÓN ═══════',
    f.descripcion || '(Pendiente de scraping)',
    '',
    '═══════ COMPATIBILIDADES ═══════',
    f.compatibilidades || '(Pendiente de scraping)',
    '',
    '═══════ FICHA TÉCNICA ═══════',
    f.specs || '(Pendiente de scraping)',
    '',
    '─────────────────────────',
    `N° LUK: ${p.sku}`,
    p.oem ? `N° Original: ${p.oem}` : '',
    `Stock: ${p.qty} ud${p.qty!==1?'s.':'.'}`,
    'Marca: LUK — Calidad Original',
  ].filter(l=>l!==undefined).join('\n');
  copy(lines).then(()=>showToast('✓ Publicación completa copiada'));
}

// ════════════════════════════════════════════════════════
//  FILTER & RENDER
// ════════════════════════════════════════════════════════
let fCat='todos', fFotos=null, fPub=null, q='';

function filtered(){
  return DB.filter(p=>{
    if(fCat!=='todos' && p.cat!==fCat)      return false;
    if(fFotos==='sin' && p.fotos!==0)        return false;
    if(fPub==='pub' && !STATE[p.id])         return false;
    if(fPub==='pend' && STATE[p.id])         return false;
    if(q){
      const s=q.toLowerCase();
      if(!p.desc.toLowerCase().includes(s)&&
         !p.sku.toLowerCase().includes(s)&&
         !(p.oem&&p.oem.toLowerCase().includes(s))) return false;
    }
    return true;
  });
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  Array.from(grid.querySelectorAll('.card')).forEach(c=>c.remove());

  const list=filtered();
  document.getElementById('count-lbl').textContent=`${list.length} artículo${list.length!==1?'s':''}`;

  if(!list.length){empty.style.display='block';return}
  empty.style.display='none';

  const frag=document.createDocumentFragment();
  list.forEach(p=>{
    const div=document.createElement('div');
    div.innerHTML=renderCard(p);
    frag.appendChild(div.firstElementChild);
  });
  grid.insertBefore(frag,empty);
}

function applyFilters(){ renderGrid() }

// Buttons
document.querySelectorAll('.fbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.f;
    // reset
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));

    if(f==='todos'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub=null;
    } else if(f==='kit'||f==='volante'||f==='otros'){
      btn.classList.add('on');
      // also activate todos visual? no — just this
      fCat=f;fFotos=null;fPub=null;
    } else if(f==='sinfoto'){
      btn.classList.add('on');
      fCat='todos';fFotos='sin';fPub=null;
    } else if(f==='publicado'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub='pub';
    } else if(f==='pendiente'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub='pend';
    }
    renderGrid();
  });
});

document.getElementById('search').addEventListener('input',e=>{
  q=e.target.value.trim();
  renderGrid();
});

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
updateStats();
updateProgress();
renderGrid();
