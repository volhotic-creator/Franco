<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Franco · Publicaciones LUK</title>
<style>
/* ══════════════════════════════════════════════
   VARIABLES & RESET  — VW-inspired palette
══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:        #001E50;
  --azul-2:      #00348D;
  --cielo:       #00B0F0;
  --cielo-dim:   rgba(0,176,240,.10);
  --cielo-glow:  rgba(0,176,240,.25);
  --bg:          #F4F6FA;
  --bg-2:        #FFFFFF;
  --card-bg:     #FFFFFF;
  --card-bg2:    #F4F6FA;
  --border:      #DDE2ED;
  --border-hot:  #00B0F0;
  --texto:       #001E50;
  --muted:       #6B7A99;
  --verde:       #00A651;
  --verde-bg:    rgba(0,166,81,.10);
  --ambar:       #F59E0B;
  --rojo:        #E4002B;
  --rojo-bg:     rgba(228,0,43,.08);
  --radius:      10px;
  --radius-sm:   6px;
  --font:        'Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--texto);
  min-height:100vh;
  overflow-x:hidden;
}

/* ══════════════════════════════════════════════
   SCROLLBAR
══════════════════════════════════════════════ */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#BDC5D9;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cielo)}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
.header{
  background:var(--azul);
  border-bottom:none;
  padding:0 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 16px rgba(0,30,80,.18);
}
.brand{display:flex;align-items:center;gap:16px;padding:14px 0}
.globo{
  width:42px;height:42px;
  background:#FFFFFF;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  flex-shrink:0;
}
.brand-text h1{
  font-size:17px;font-weight:700;
  color:#FFFFFF;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.brand-text p{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:.3px}

/* Stats strip */
.stats-strip{
  display:flex;gap:6px;padding:10px 0;flex-wrap:wrap;
}
.stat-pill{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:8px;
  padding:6px 16px;
  text-align:center;
  transition:background .2s;
}
.stat-pill:hover{background:rgba(255,255,255,.14)}
.stat-pill .n{
  font-size:18px;font-weight:800;
  color:#FFFFFF;
  line-height:1;display:block;
}
.stat-pill .l{
  font-size:9px;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:.6px;
}
.stat-pill.pub .n{color:#4AE28A}
.stat-pill.warn .n{color:#FFD166}

/* Progress bar */
.progress-bar-wrap{
  width:100%;height:3px;
  background:rgba(0,30,80,.6);
}
.progress-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--cielo),#4AE28A);
  transition:width .5s ease;
  border-radius:0 2px 2px 0;
}

/* ══════════════════════════════════════════════
   TOOLBAR
══════════════════════════════════════════════ */
.toolbar{
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  padding:10px 32px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  position:sticky;top:85px;z-index:199;
  box-shadow:0 1px 4px rgba(0,30,80,.06);
}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap svg{
  position:absolute;left:12px;top:50%;
  transform:translateY(-50%);
  width:15px;height:15px;color:var(--muted);
}
#search{
  width:100%;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px 9px 36px;
  color:var(--texto);
  font-size:14px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
#search:focus{
  border-color:var(--cielo);
  box-shadow:0 0 0 3px var(--cielo-dim);
}
#search::placeholder{color:#A0AABE}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;font-weight:600;
  color:var(--muted);
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  letter-spacing:.3px;
}
.fbtn:hover{border-color:var(--cielo);color:var(--azul)}
.fbtn.on{
  background:var(--azul);
  border-color:var(--azul);
  color:#fff;
}
.fbtn.warn-btn.on{background:var(--ambar);border-color:var(--ambar);color:#000}
.fbtn.pub-btn.on{background:var(--verde);border-color:var(--verde);color:#fff}
#count-lbl{
  margin-left:auto;
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}

/* ══════════════════════════════════════════════
   GRID
══════════════════════════════════════════════ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(380px,1fr));
  gap:16px;
  padding:20px 32px 60px;
  max-width:1440px;margin:0 auto;
}

/* ══════════════════════════════════════════════
   CARD
══════════════════════════════════════════════ */
.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:border-color .2s,box-shadow .2s,transform .18s;
  box-shadow:0 1px 6px rgba(0,30,80,.06);
}
.card:hover{
  border-color:var(--border-hot);
  box-shadow:0 4px 20px rgba(0,176,240,.14);
  transform:translateY(-2px);
}
.card.publicado{
  border-color:rgba(0,166,81,.35);
  opacity:.72;
}
.card.publicado:hover{opacity:1}
.card.sin-foto{border-color:rgba(245,158,11,.35)}

/* Card top stripe */
.card-stripe{
  height:4px;
  background:linear-gradient(90deg,var(--azul),var(--cielo));
}
.card.sin-foto .card-stripe{background:linear-gradient(90deg,var(--ambar),#D97706)}
.card.publicado .card-stripe{background:linear-gradient(90deg,var(--verde),#00C86A)}

/* Card header */
.card-head{
  padding:14px 16px 10px;
  display:flex;align-items:flex-start;gap:10px;
}
.cat-tag{
  flex-shrink:0;
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  padding:3px 9px;border-radius:20px;
  margin-top:2px;
}
.tag-kit{background:rgba(0,166,81,.10);color:#007A3D;border:1px solid rgba(0,166,81,.25)}
.tag-vol{background:var(--cielo-dim);color:#005B8E;border:1px solid rgba(0,176,240,.3)}
.tag-otro{background:rgba(0,30,80,.06);color:var(--azul-2);border:1px solid rgba(0,30,80,.15)}
.card-title{
  font-size:14px;font-weight:700;
  color:var(--azul);line-height:1.45;
  flex:1;
}

/* Pub badge */
.pub-mark{
  flex-shrink:0;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--verde-bg);
  border:1.5px solid var(--verde);
  display:flex;align-items:center;justify-content:center;
  display:none;
}
.card.publicado .pub-mark{display:flex}
.pub-mark svg{width:11px;height:11px;color:var(--verde)}

/* Sin foto banner */
.no-foto-bar{
  background:rgba(245,158,11,.06);
  border-top:1px solid rgba(245,158,11,.2);
  border-bottom:1px solid rgba(245,158,11,.2);
  padding:5px 16px;
  font-size:11px;font-weight:700;
  color:#92650A;
  display:flex;align-items:center;gap:6px;
}

/* Card body */
.card-body{padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:8px}

/* Fields (legacy, not shown in new layout but kept for safety) */
.fields{display:flex;flex-direction:column;gap:6px}
.field{
  display:flex;align-items:center;gap:8px;
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:7px 10px;
  min-height:36px;
}
.field-lbl{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);
  white-space:nowrap;
  min-width:80px;
}
.field-val{
  font-size:13px;font-weight:600;
  color:var(--texto);
  flex:1;
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  word-break:break-all;
}
.field-val.txt{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:400}
.field-val.na{color:#B0BBCC;font-style:italic;font-family:var(--font);font-weight:400;font-size:12px}
.field-val.pend{
  color:var(--ambar);font-family:var(--font);font-size:11px;font-weight:600;font-style:italic;
}

/* Stock indicator */
.stock-ind{display:flex;align-items:center;gap:6px}
.stock-dot{width:7px;height:7px;border-radius:50%;background:var(--verde);flex-shrink:0}
.stock-dot.low{background:var(--ambar)}
.stock-dot.out{background:var(--rojo)}
.stock-num{font-size:13px;font-weight:700;color:var(--azul);font-family:'SF Mono',monospace}
.fotos-ind{
  display:flex;align-items:center;gap:5px;
  font-size:12px;font-weight:600;color:var(--cielo);
  font-family:var(--font);
}

/* Copy micro-button */
.cbtn{
  background:none;border:none;cursor:pointer;
  padding:4px;border-radius:5px;
  color:#A0AABE;
  transition:all .15s;flex-shrink:0;
}
.cbtn:hover{color:var(--cielo);background:var(--cielo-dim)}
.cbtn.ok{color:var(--verde)}
.cbtn svg{display:block;width:13px;height:13px}

/* Divider */
.divider{
  height:1px;background:var(--border);margin:4px 0;
}

/* Section label */
.sec-label{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--azul);
  padding:2px 0;
}

/* ══════════════════════════════════════════════
   COPY BLOCK (ML sections)
══════════════════════════════════════════════ */
.copy-block{
  background:var(--card-bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.copy-block-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;
  border-bottom:1px solid var(--border);
}
.copy-block-label{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);
}
.copy-block-body{
  padding:9px 10px;
  font-size:11px;color:var(--muted);
  line-height:1.55;
  max-height:80px;overflow:hidden;
  white-space:pre-wrap;
  word-break:break-word;
}
.copy-block-body.pend{
  color:rgba(245,158,11,.4);
  font-style:italic;
}
.copy-block-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;
  color:var(--muted);
  padding:3px 7px;border-radius:5px;
  transition:all .15s;
  letter-spacing:.3px;
}
.copy-block-btn:hover{color:var(--cielo);background:var(--cielo-dim)}
.copy-block-btn.ok{color:var(--verde)}
.copy-block-btn svg{width:11px;height:11px}

/* ══════════════════════════════════════════════
   CARD FOOTER
══════════════════════════════════════════════ */
.card-foot{
  padding:12px 16px;
  border-top:1px solid var(--border);
  display:flex;gap:8px;
  background:var(--card-bg2);
}
.btn-pub{
  flex:1;
  background:var(--azul);
  color:#fff;
  border:none;border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:11px;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .18s;
  letter-spacing:.5px;
  text-transform:uppercase;
}
.btn-pub:hover{background:var(--azul-2);box-shadow:0 2px 10px rgba(0,30,80,.2)}
.btn-pub:active{transform:scale(.97)}
.btn-pub.ok{
  background:var(--verde);
}
.btn-pub svg{width:14px;height:14px}

.btn-done{
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  color:var(--muted);font-size:11px;font-weight:700;
  cursor:pointer;
  transition:all .18s;
  white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.btn-done:hover{border-color:var(--verde);color:var(--verde)}
.card.publicado .btn-done{
  border-color:var(--verde);
  color:var(--verde);
  background:var(--verde-bg);
}
.btn-done svg{width:13px;height:13px}

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--azul);color:#fff;
  padding:10px 22px;border-radius:8px;
  font-size:13px;font-weight:700;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:9999;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,30,80,.25);
  letter-spacing:.3px;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════════════ */
#empty{
  display:none;
  grid-column:1/-1;
  text-align:center;padding:60px 20px;
  color:var(--muted);
}
#empty .big{font-size:48px;margin-bottom:12px}
#empty p{font-size:15px}

/* ══════════════════════════════════════════════
   INFO STRIP (badges under card header)
══════════════════════════════════════════════ */
.info-strip{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:4px 16px 10px;
  border-bottom:1px solid var(--border);
}
.ibadge{
  font-size:10px;font-weight:600;
  padding:3px 10px;border-radius:20px;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--muted);
  display:flex;align-items:center;gap:4px;
}
.ibadge.ok{color:#007A3D;border-color:rgba(0,166,81,.25);background:rgba(0,166,81,.07)}
.ibadge.warn{color:#92650A;border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.08)}
.ibadge.precio{color:var(--azul-2);border-color:rgba(0,52,128,.2);background:rgba(0,52,128,.05)}
.ibadge.compat{color:var(--cielo);border-color:rgba(0,176,240,.3);background:var(--cielo-dim)}

/* ══════════════════════════════════════════════
   CP-SECTION (numbered copy sections)
══════════════════════════════════════════════ */
.cp-section{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden;
  transition:border-color .18s,box-shadow .18s;
}
.cp-section:hover{border-color:var(--cielo);box-shadow:0 0 0 3px var(--cielo-dim)}

.cp-section-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  background:#fff;
  border-bottom:1px solid var(--border);
}
.cp-num{
  width:22px;height:22px;
  border-radius:50%;
  background:var(--azul);
  color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.cp-section-label{
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--azul);
  flex:1;
}
.cp-chars{
  font-size:9px;color:var(--muted);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1px 7px;
  white-space:nowrap;
}
.cp-big-btn{
  background:var(--azul);
  border:none;
  border-radius:6px;
  padding:6px 14px;
  color:#fff;
  font-size:10px;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:all .15s;
  white-space:nowrap;
  letter-spacing:.4px;
  flex-shrink:0;
}
.cp-big-btn:hover{background:var(--azul-2);box-shadow:0 2px 8px rgba(0,30,80,.2)}
.cp-big-btn:active{transform:scale(.95)}
.cp-big-btn.ok{background:var(--verde);color:#fff}
.cp-big-btn svg{width:12px;height:12px}

.cp-na-tag{
  font-size:10px;color:#A0AABE;
  font-style:italic;
  margin-left:auto;
}

.cp-section-val{
  padding:9px 12px;
  font-size:12px;
  color:var(--texto);
  line-height:1.5;
  word-break:break-word;
}
.cp-section-val.mono{
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  font-size:13px;font-weight:700;
  color:var(--azul-2);
  letter-spacing:.5px;
}
.cp-section-val.txt{
  font-size:11px;color:var(--muted);
  max-height:80px;overflow:hidden;
  white-space:pre-wrap;
}
.cp-section-val.na{color:#B0BBCC;font-style:italic}

.cp-section-sub{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px 7px;
  border-top:1px solid var(--border);
  background:var(--bg);
}
.cp-sub-label{
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);
  min-width:36px;
}
.cp-sub-val{
  font-size:11px;font-weight:700;
  font-family:'SF Mono','Fira Code','Consolas',monospace;
  color:var(--azul);
  flex:1;
  word-break:break-all;
}
.cp-sub-btn{
  background:none;border:1px solid var(--border);
  border-radius:5px;padding:3px 8px;
  color:var(--muted);font-size:9px;font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;gap:4px;
  transition:all .15s;
  white-space:nowrap;
}
.cp-sub-btn:hover{border-color:var(--cielo);color:var(--azul)}
.cp-sub-btn.ok{color:var(--verde);border-color:var(--verde)}
.cp-sub-btn svg{width:10px;height:10px}

/* ══════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════ */
@media(max-width:640px){
  .header,.toolbar{padding:0 14px}
  .toolbar{top:0;position:static}
  .header{position:static}
  .grid{padding:14px;gap:12px}
  .stats-strip{gap:4px}
}
</style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header class="header">
  <div class="brand">
    <div class="globo">🏐</div>
    <div class="brand-text">
      <h1>FRANCO · PUBLICACIONES LUK</h1>
      <p>Dashboard de repuestos · MercadoLibre</p>
    </div>
  </div>
  <div class="stats-strip">
    <div class="stat-pill">
      <span class="n" id="s-total">54</span>
      <span class="l">Total</span>
    </div>
    <div class="stat-pill pub">
      <span class="n" id="s-pub">0</span>
      <span class="l">Publicados</span>
    </div>
    <div class="stat-pill">
      <span class="n" id="s-pend">54</span>
      <span class="l">Pendientes</span>
    </div>
    <div class="stat-pill warn">
      <span class="n" id="s-sfoto">5</span>
      <span class="l">Sin fotos</span>
    </div>
    <div class="stat-pill">
      <span class="n" id="s-stock">—</span>
      <span class="l">Uds. stock</span>
    </div>
  </div>
</header>
<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="prog" style="width:0%"></div>
</div>

<!-- ═══════════════════ TOOLBAR ═══════════════════ -->
<div class="toolbar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" type="text" placeholder="Buscar descripción, SKU, N° original…" autocomplete="off"/>
  </div>
  <div class="filters">

// ════════════════════════════════════════════════════════
//  ESTADO PUBLICADO — persiste en localStorage
// ════════════════════════════════════════════════════════
function loadState(){
  try{ return JSON.parse(localStorage.getItem('luk_pub')||'{}') }
  catch(e){ return {} }
}
function saveState(s){
  try{ localStorage.setItem('luk_pub',JSON.stringify(s)) }catch(e){}
}
let STATE = loadState();

function togglePublicado(id){
  STATE[id] = !STATE[id];
  saveState(STATE);
  updateStats();
  updateProgress();
  // re-render the single card
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    card.classList.toggle('publicado', !!STATE[id]);
    const stripe = card.querySelector('.card-stripe');
    const btnDone = card.querySelector('.btn-done');
    if(STATE[id]){
      stripe && (stripe.style.background='linear-gradient(90deg,#22c55e,#16a34a)');
      btnDone && (btnDone.innerHTML = IC_CHECK + ' Publicado');
    } else {
      const base = card.dataset.sfoto==='1'
        ? 'linear-gradient(90deg,#F59E0B,#D97706)'
        : 'linear-gradient(90deg,#001E50,#00B0F0)';
      stripe && (stripe.style.background=base);
      btnDone && (btnDone.innerHTML = IC_CIRCLE + ' Marcar pub.');
    }
    card.querySelector('.pub-mark') && (card.querySelector('.pub-mark').style.display = STATE[id]?'flex':'none');
  }
  // apply filter
  applyFilters();
}

// ════════════════════════════════════════════════════════
//  STATS & PROGRESS
// ════════════════════════════════════════════════════════
function updateStats(){
  const pub   = Object.values(STATE).filter(Boolean).length;
  const pend  = DB.length - pub;
  const stock = DB.reduce((a,p)=>a+p.qty,0);
  const sf    = DB.filter(p=>p.fotos===0).length;
  document.getElementById('s-total').textContent = DB.length;
  document.getElementById('s-pub').textContent   = pub;
  document.getElementById('s-pend').textContent  = pend;
  document.getElementById('s-sfoto').textContent = sf;
  document.getElementById('s-stock').textContent = stock;
}
function updateProgress(){
  const pub = Object.values(STATE).filter(Boolean).length;
  const pct = Math.round(pub/DB.length*100);
  document.getElementById('prog').style.width = pct+'%';
}

// ════════════════════════════════════════════════════════
//  ICONS
// ════════════════════════════════════════════════════════
const IC_COPY   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
const IC_CHECK  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
const IC_CIRCLE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
const IC_ML     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const IC_WARN   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;

// ════════════════════════════════════════════════════════
//  COPY
// ════════════════════════════════════════════════════════
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1700);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text);return true }
  catch{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    return true;
  }
}
function cpField(btn,text,label){
  copy(text).then(()=>{
    const orig=btn.innerHTML;
    btn.classList.add('ok');btn.innerHTML=IC_CHECK;
    showToast('✓ '+label+' copiado');
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=orig},1600);
  });
}
function cpBlock(btn,text,label){
  copy(text).then(()=>{
    const orig=btn.innerHTML;
    btn.classList.add('ok');btn.innerHTML=IC_CHECK+' Copiado';
    showToast('✓ '+label+' copiado');
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=orig},1700);
  });
}

// ════════════════════════════════════════════════════════
//  BUILD TITULO ML (optimizado, ~60 chars)
// ════════════════════════════════════════════════════════
function tituloML(p){
  const f = FICHAS[p.id];
  if(f && f.titulo_ml) return f.titulo_ml;
  // auto-generate
  const base = p.desc.replace(/\s+/g,' ').trim();
  const sku  = p.sku.replace(/\s/g,'');
  let t = `${base} LUK ${sku}`;
  if(t.length > 60) t = t.slice(0,57)+'...';
  return t;
}

// ════════════════════════════════════════════════════════
//  RENDER CARD
// ════════════════════════════════════════════════════════
function catTag(c){
  if(c==='kit')     return ['Kit Embrague','tag-kit'];
  if(c==='volante') return ['Volante Bimasa','tag-vol'];
  return ['Otro','tag-otro'];
}

function renderCard(p){
  const pub     = !!STATE[p.id];
  const sf      = p.fotos===0;
  const f       = FICHAS[p.id]||{};
  const [tl,tc] = catTag(p.cat);
  const tituloVal = tituloML(p);
  const descVal   = f.descripcion   || null;
  const compatVal = f.compatibilidades || null;
  const specsVal  = f.specs          || null;

  const stockCls = p.qty===0?'out':p.qty<=2?'low':'';
  const stockLbl = p.qty===0?'Sin stock':p.qty+' ud'+(p.qty!==1?'s.':`${p.qty===1?'.':'.'}`);

  const fotosHtml = sf
    ? `<span style="color:#f59e0b;font-size:11px;font-weight:700;">⚠ Sin fotos</span>`
    : `<span class="fotos-ind">📷 ${p.fotos} foto${p.fotos!==1?'s':''}</span>`;

  const oemHtml = p.oem
    ? `<span class="field-val">${p.oem}</span><button class="cbtn" onclick="cpField(this,'${p.oem}','N° Original')" title="Copiar">${IC_COPY}</button>`
    : `<span class="field-val na">No disponible</span>`;

  const noFotaBanner = sf
    ? `<div class="no-foto-bar">${IC_WARN} Faltan fotos — pendiente de imágenes</div>`
    : '';

  // ML copy blocks
  function block(label, val){
    const hasPend = !val || !val.trim();
    const bodyTxt = hasPend ? '⚠ Sin datos de scraping para este artículo' : val;
    const bodyCls = hasPend ? 'copy-block-body pend' : 'copy-block-body';
    const safeval = hasPend ? '' : val.replace(/\\/g,'\\\\').replace(/`/g,"'").replace(/\${/g,'\\${');
    const btnHtml = hasPend
      ? `<span class="copy-block-btn" style="color:#444;cursor:default">—</span>`
      : `<button class="copy-block-btn" onclick="cpBlock(this,\`${safeval}\`,'${label}')">${IC_COPY} Copiar</button>`;
    return `
<div class="copy-block">
  <div class="copy-block-header">
    <span class="copy-block-label">${label}</span>
    ${btnHtml}
  </div>
  <div class="${bodyCls}">${bodyTxt.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
</div>`;
  }

  // Precio formateado
  const precioFmt = f.precio
    ? '$' + Number(f.precio).toLocaleString('es-AR')
    : null;
  const eanVal = f.ean && f.ean.trim() ? f.ean.trim() : null;
  const vcntVal = f.vcnt && f.vcnt > 0 ? f.vcnt : null;

  // Badge info strip (stock, fotos, precio, vehiculos)
  const infoBadges = [
    `<span class="ibadge"><span class="stock-dot ${stockCls}"></span>${p.qty} ud${p.qty!==1?'s.':'.'}</span>`,
    sf ? `<span class="ibadge warn">⚠ Sin fotos</span>`
       : `<span class="ibadge">📷 ${p.fotos} foto${p.fotos!==1?'s':''}</span>`,
    precioFmt ? `<span class="ibadge precio">${precioFmt}</span>` : '',
    vcntVal   ? `<span class="ibadge compat">🚗 ${vcntVal}+ modelos</span>` : '',
  ].filter(Boolean).join('');

  // safe values for inline onclick (no backticks, no single quotes)
  const skuSafe = p.sku.replace(/'/g,"\\'");
  const oemSafe = p.oem ? p.oem.replace(/'/g,"\\'") : '';
  const eanSafe = eanVal ? eanVal.replace(/'/g,"\\'") : '';

  return `
<div class="card${pub?' publicado':''}${sf?' sin-foto':''}" data-id="${p.id}" data-cat="${p.cat}" data-fotos="${sf?0:1}" data-sfoto="${sf?1:0}">
  <div class="card-stripe"${pub?' style="background:linear-gradient(90deg,#00A651,#00C86A)"'
    :sf?' style="background:linear-gradient(90deg,#F59E0B,#D97706)"':''}></div>

  <!-- HEAD -->
  <div class="card-head">
    <span class="cat-tag ${tc}">${tl}</span>
    <span class="card-title">${p.desc}</span>
    <div class="pub-mark" style="${pub?'display:flex':'display:none'}">${IC_CHECK}</div>
  </div>

  ${noFotaBanner}

  <!-- INFO STRIP -->
  <div class="info-strip">${infoBadges}</div>

  <!-- COPY SECTIONS -->
  <div class="card-body">

    <!-- 1. TÍTULO -->
    <div class="cp-section">
      <div class="cp-section-head">
        <span class="cp-num">1</span>
        <span class="cp-section-label">Título</span>
        <span class="cp-chars">${tituloVal.length} chars</span>
        <button class="cp-big-btn" onclick="cpTitulo(this,${p.id})">
          ${IC_COPY} Copiar título
        </button>
      </div>
      <div class="cp-section-val">${tituloVal}</div>
    </div>

    <!-- 2. SKU LUK -->
    <div class="cp-section">
      <div class="cp-section-head">
        <span class="cp-num">2</span>
        <span class="cp-section-label">SKU / N° LUK</span>
        <button class="cp-big-btn" onclick="cpField(this,'${skuSafe}','SKU LUK')">
          ${IC_COPY} Copiar SKU
        </button>
      </div>
      <div class="cp-section-val mono">${p.sku}</div>
    </div>

    <!-- 3. CÓDIGO OEM -->
    <div class="cp-section">
      <div class="cp-section-head">
        <span class="cp-num">3</span>
        <span class="cp-section-label">Código OEM</span>
        ${p.oem
          ? `<button class="cp-big-btn" onclick="cpField(this,'${oemSafe}','OEM')">${IC_COPY} Copiar OEM</button>`
          : `<span class="cp-na-tag">No disponible</span>`}
      </div>
      ${p.oem
        ? `<div class="cp-section-val mono">${p.oem}</div>`
        : `<div class="cp-section-val na">—</div>`}
      ${eanVal ? `
      <div class="cp-section-sub">
        <span class="cp-sub-label">EAN:</span>
        <span class="cp-sub-val">${eanVal}</span>
        <button class="cp-sub-btn" onclick="cpField(this,'${eanSafe}','EAN')">${IC_COPY}</button>
      </div>` : ''}
    </div>

    <!-- 4. FICHA TÉCNICA -->
    <div class="cp-section">
      <div class="cp-section-head">
        <span class="cp-num">4</span>
        <span class="cp-section-label">Ficha Técnica</span>
        ${specsVal
          ? `<button class="cp-big-btn" onclick="cpBlock(this,\`${specsVal.replace(/\\/g,'\\\\').replace(/`/g,"'").replace(/\${/g,'\\${')}\`,'Ficha Técnica')">${IC_COPY} Copiar ficha</button>`
          : `<span class="cp-na-tag">Sin datos</span>`}
      </div>
      <div class="cp-section-val txt ${specsVal?'':'na'}">${specsVal || 'Sin datos de scraping'}</div>
    </div>

    <!-- 5. DESCRIPCIÓN (extra para ML) -->
    ${block('📝 Descripción completa (ML)',    descVal)}
    ${block('🚗 Compatibilidades (ML)',         compatVal)}

  </div>

  <div class="card-foot">
    <button class="btn-pub" onclick="cpFull(${p.id})">
      ${IC_ML} Copiar todo para ML
    </button>
    <button class="btn-done" onclick="togglePublicado(${p.id})">
      ${pub ? IC_CHECK+' Publicado' : IC_CIRCLE+' Marcar pub.'}
    </button>
  </div>
</div>`;
}

// ════════════════════════════════════════════════════════
//  COPY TODO PARA ML
// ════════════════════════════════════════════════════════
function cpTitulo(btn,id){
  const p = DB.find(x=>x.id===id);
  const t = tituloML(p);
  cpBlock(btn, t, 'Título ML');
}

function cpFull(id){
  const p = DB.find(x=>x.id===id);
  const f = FICHAS[id]||{};
  const precioFmt = f.precio ? '$'+Number(f.precio).toLocaleString('es-AR') : null;
  const lines=[
    '═══════ TÍTULO ═══════',
    tituloML(p),
    '',
    '═══════ DESCRIPCIÓN ═══════',
    f.descripcion || '(Sin datos)',
    '',
    '═══════ VEHICULOS COMPATIBLES ═══════',
    f.compatibilidades || '(Sin datos)',
    '',
    '═══════ FICHA TÉCNICA ═══════',
    f.specs || '(Sin datos)',
    '',
    '─────────────────────────',
    `N° LUK:      ${p.sku}`,
    p.oem        ? `N° Original: ${p.oem}`      : null,
    f.ean        ? `EAN:         ${f.ean}`       : null,
    precioFmt    ? `Precio:      ${precioFmt}`   : null,
    `Stock:       ${p.qty} ud${p.qty!==1?'s.':'.'}`,
    'Marca:       LUK — Calidad Original',
  ].filter(l=>l!=null).join('\n');
  copy(lines).then(()=>showToast('✓ Publicación completa copiada'));
}

// ════════════════════════════════════════════════════════
//  FILTER & RENDER
// ════════════════════════════════════════════════════════
let fCat='todos', fFotos=null, fPub=null, q='';

function filtered(){
  return DB.filter(p=>{
    if(fCat!=='todos' && p.cat!==fCat)      return false;
    if(fFotos==='sin' && p.fotos!==0)        return false;
    if(fPub==='pub' && !STATE[p.id])         return false;
    if(fPub==='pend' && STATE[p.id])         return false;
    if(q){
      const s=q.toLowerCase();
      if(!p.desc.toLowerCase().includes(s)&&
         !p.sku.toLowerCase().includes(s)&&
         !(p.oem&&p.oem.toLowerCase().includes(s))) return false;
    }
    return true;
  });
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const empty=document.getElementById('empty');
  Array.from(grid.querySelectorAll('.card')).forEach(c=>c.remove());

  const list=filtered();
  document.getElementById('count-lbl').textContent=`${list.length} artículo${list.length!==1?'s':''}`;

  if(!list.length){empty.style.display='block';return}
  empty.style.display='none';

  const frag=document.createDocumentFragment();
  list.forEach(p=>{
    const div=document.createElement('div');
    div.innerHTML=renderCard(p);
    frag.appendChild(div.firstElementChild);
  });
  grid.insertBefore(frag,empty);
}

function applyFilters(){ renderGrid() }

// Buttons
document.querySelectorAll('.fbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.f;
    // reset
    document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));

    if(f==='todos'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub=null;
    } else if(f==='kit'||f==='volante'||f==='otros'){
      btn.classList.add('on');
      // also activate todos visual? no — just this
      fCat=f;fFotos=null;fPub=null;
    } else if(f==='sinfoto'){
      btn.classList.add('on');
      fCat='todos';fFotos='sin';fPub=null;
    } else if(f==='publicado'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub='pub';
    } else if(f==='pendiente'){
      btn.classList.add('on');
      fCat='todos';fFotos=null;fPub='pend';
    }
    renderGrid();
  });
});

document.getElementById('search').addEventListener('input',e=>{
  q=e.target.value.trim();
  renderGrid();
});
